<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>FleetCore - Restricted Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400..700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="../assets/css/auth-theme.css" rel="stylesheet"/>
<style>
body{font-family:'Inter',sans-serif;}
.font-display{font-family:'Manrope',sans-serif;}
.font-mono{font-family:'JetBrains Mono',monospace;}
.fc-auth-bg.fc-bex { background: radial-gradient(120% 120% at 50% 0%, #2a0f14 0%, #150a0d 45%, #0a0607 100%); }
.fc-glow-bex-1 { background:#7f1d1d; }
.fc-glow-bex-2 { background:#78350f; }
</style>
</head>
<body class="fc-auth-bg fc-bex">

<div class="fc-glow fc-glow-1 fc-glow-bex-1"></div>
<div class="fc-glow fc-glow-2 fc-glow-bex-2"></div>
<div class="fc-road" style="background-image:repeating-linear-gradient(115deg, rgba(248,113,113,0.06) 0px, rgba(248,113,113,0.06) 2px, transparent 2px, transparent 90px);"></div>

<div class="w-full max-w-sm">

  <div class="flex flex-col items-center mb-6 fc-rise">
    <div class="w-14 h-14 rounded-2xl bg-white/5 border border-red-500/30 flex items-center justify-center mb-3">
      <span class="material-symbols-outlined text-red-400" style="font-size:26px;">shield_lock</span>
    </div>
    <p class="font-mono text-[11px] tracking-[0.25em] text-red-300/70 uppercase">Bex Admin // Platform Access</p>
  </div>

  <div class="fc-glass p-8" style="border-color:rgba(248,113,113,0.18);">
    <div class="text-center mb-6 fc-rise" style="animation-delay:.05s">
      <h1 class="font-display text-xl font-extrabold text-white mb-1">Restricted Access</h1>
      <p class="text-[12.5px] text-white/40 font-mono">Cross-tenant credentials required. All access is logged.</p>
    </div>

    <form class="flex flex-col gap-4 fc-rise" id="login-form" style="animation-delay:.1s">
      <div>
        <label class="block text-[12px] font-semibold text-white/60 mb-1.5 uppercase tracking-wide font-mono">Admin Email</label>
        <div class="fc-input-glow">
          <input autocomplete="email" id="email" name="email" placeholder="you@bexlabs.com" required type="email"/>
        </div>
      </div>
      <div>
        <label class="block text-[12px] font-semibold text-white/60 mb-1.5 uppercase tracking-wide font-mono">Password</label>
        <div class="fc-input-glow">
          <input autocomplete="current-password" id="password" name="password" placeholder="••••••••" required type="password"/>
        </div>
      </div>
      <div>
        <label class="block text-[12px] font-semibold text-white/60 mb-1.5 uppercase tracking-wide font-mono">TOTP Code</label>
        <div class="fc-input-glow">
          <input autocomplete="one-time-code" id="totp" inputmode="numeric" maxlength="6" name="totp" placeholder="000000" style="letter-spacing:0.4em;text-align:center;" type="text"/>
        </div>
        <p class="text-[11px] text-white/25 mt-1.5 font-mono">From your authenticator app. Contact platform ops if unenrolled.</p>
      </div>
      <button class="fc-submit mt-1" id="login-btn" style="background:linear-gradient(135deg,#7f1d1d,#78350f);box-shadow:0 8px 24px rgba(127,29,29,0.35);" type="submit">Authenticate</button>
    </form>
  </div>

  <p class="text-center text-[11px] text-white/25 mt-6 font-mono">
    <a class="hover:text-white/50" href="../index.html">← Back to standard login</a>
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="../js/config.js"></script>
<script type="module" src="../js/auth.js"></script>
</body>
</html>
