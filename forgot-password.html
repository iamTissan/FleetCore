<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FleetCore - Forgot Password</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border-light": "#E2E8F0",
            "on-primary": "#ffffff",
            "warning-amber": "#D97706",
            "background-subtle": "#F8FAFC",
            "secondary": "#006c4a",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-surface": "#131b2e",
            "on-background": "#131b2e",
            "surface-container-lowest": "#ffffff",
            "text-muted": "#64748B",
            "danger-red": "#DC2626"
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background-subtle text-on-surface font-body min-h-screen flex items-center justify-center antialiased p-4 sm:p-6">
  <div class="w-full max-w-md bg-surface-container-lowest border border-border-light rounded-2xl p-8 sm:p-10 shadow-sm transition-all">
    
    <!-- Brand Header -->
    <div class="flex items-center gap-2.5 mb-8">
      <img alt="FleetCore" class="w-9 h-9 rounded-md object-contain" src="assets/images/logo.png"/>
      <span class="font-display text-xl font-black tracking-tight text-primary">FleetCore</span>
    </div>

    <!-- Step 1: Input Form -->
    <div id="step-request">
      <h1 class="font-display text-2xl font-bold text-on-background tracking-tight mb-1">Reset Password</h1>
      <p class="text-sm text-text-muted mb-6">Enter your registered email address and we'll send you an encrypted recovery link.</p>

      <!-- Dynamic Alert Container -->
      <div id="alert-message" class="hidden mb-5 p-3 rounded-lg text-sm flex items-start gap-2 bg-red-50 text-danger-red border border-red-200">
        <span class="material-symbols-outlined text-base mt-0.5 shrink-0">error</span>
        <span id="alert-text"></span>
      </div>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Work Email</label>
          <div class="relative">
            <input 
              id="email" 
              name="email" 
              type="email" 
              autocomplete="email"
              required 
              placeholder="operator@company.com" 
              class="w-full px-3.5 py-2.5 border border-border-light rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
            />
          </div>
        </div>

        <button 
          id="send-btn" 
          type="submit" 
          class="w-full mt-2 bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-semibold text-sm py-3 px-4 rounded-xl shadow-sm transition duration-150 flex items-center justify-center gap-2"
        >
          <span>Send Recovery Link</span>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-border-light text-center">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-text-muted hover:text-on-surface transition">
          <span class="material-symbols-outlined text-base">arrow_back</span>
          <span>Back to login</span>
        </a>
      </div>
    </div>

    <!-- Step 2: Sent Confirmation State -->
    <div id="step-sent" class="hidden text-center flex flex-col items-center">
      <div class="w-16 h-16 rounded-full bg-blue-50 text-primary flex items-center justify-center mb-5">
        <span class="material-symbols-outlined text-3xl">mark_email_read</span>
      </div>
      <h2 class="font-display text-2xl font-bold text-on-background tracking-tight mb-2">Check your inbox</h2>
      <p class="text-sm text-text-muted leading-relaxed mb-6">
        We dispatched a reset token to <strong id="sent-to" class="text-on-surface font-semibold"></strong>. Follow the instructions to proceed.
      </p>
      
      <p class="text-xs text-text-muted mb-6">
        Didn't receive it? Check spam or <button id="resend-btn" class="text-primary hover:underline font-medium">resend link</button>.
      </p>

      <a href="index.html" class="w-full block bg-background-subtle hover:bg-slate-100 text-on-surface font-semibold text-sm py-2.5 px-4 rounded-xl border border-border-light transition text-center">
        Return to Login
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
