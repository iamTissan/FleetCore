<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FleetCore - Set New Password</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border-light": "#E2E8F0",
            "on-primary": "#ffffff",
            "warning-amber": "#D97706",
            "background-subtle": "#F8FAFC",
            "secondary": "#006c4a",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-surface": "#131b2e",
            "on-background": "#131b2e",
            "surface-container-lowest": "#ffffff",
            "text-muted": "#64748B",
            "danger-red": "#DC2626"
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background-subtle text-on-surface font-body min-h-screen flex items-center justify-center antialiased p-4 sm:p-6">
  <div class="w-full max-w-md bg-surface-container-lowest border border-border-light rounded-2xl p-8 sm:p-10 shadow-sm transition-all">
    
    <!-- Brand Header -->
    <div class="flex items-center gap-2.5 mb-8">
      <img alt="FleetCore" class="w-9 h-9 rounded-md object-contain" src="assets/images/logo.png"/>
      <span class="font-display text-xl font-black tracking-tight text-primary">FleetCore</span>
    </div>

    <!-- Form Section -->
    <div id="reset-container">
      <h1 class="font-display text-2xl font-bold text-on-background tracking-tight mb-1">Set New Password</h1>
      <p class="text-sm text-text-muted mb-6">Choose a secure password containing at least 8 characters.</p>

      <!-- Dynamic Alert Container -->
      <div id="alert-message" class="hidden mb-5 p-3 rounded-lg text-sm flex items-start gap-2 bg-red-50 text-danger-red border border-red-200">
        <span class="material-symbols-outlined text-base mt-0.5 shrink-0">error</span>
        <span id="alert-text"></span>
      </div>

      <form id="reset-form" class="space-y-4">
        <!-- New Password -->
        <div>
          <label for="new-password" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">New Password</label>
          <div class="relative">
            <input 
              id="new-password" 
              name="newPassword" 
              type="password" 
              minlength="8" 
              required 
              placeholder="••••••••"
              class="w-full px-3.5 py-2.5 pr-10 border border-border-light rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
            />
            <button 
              type="button" 
              aria-label="Toggle password visibility" 
              class="password-toggle absolute right-3 top-2.5 text-text-muted hover:text-on-surface"
              onclick="toggleVisibility('new-password', this)"
            >
              <span class="material-symbols-outlined text-lg">visibility</span>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Confirm New Password</label>
          <div class="relative">
            <input 
              id="confirm-password" 
              name="confirmPassword" 
              type="password" 
              minlength="8" 
              required 
              placeholder="••••••••"
              class="w-full px-3.5 py-2.5 pr-10 border border-border-light rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition"
            />
            <button 
              type="button" 
              aria-label="Toggle confirm password visibility" 
              class="password-toggle absolute right-3 top-2.5 text-text-muted hover:text-on-surface"
              onclick="toggleVisibility('confirm-password', this)"
            >
              <span class="material-symbols-outlined text-lg">visibility</span>
            </button>
          </div>
          <p id="match-error" class="hidden text-xs text-danger-red mt-1.5">Passwords do not match.</p>
        </div>

        <button 
          id="submit-btn" 
          type="submit" 
          class="w-full mt-2 bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-semibold text-sm py-3 px-4 rounded-xl shadow-sm transition duration-150 flex items-center justify-center gap-2"
        >
          <span>Update Password</span>
        </button>
      </form>
    </div>

    <!-- Password Changed Success Modal/View -->
    <div id="reset-success" class="hidden text-center flex flex-col items-center">
      <div class="w-16 h-16 rounded-full bg-emerald-50 text-secondary flex items-center justify-center mb-5">
        <span class="material-symbols-outlined text-4xl">check_circle</span>
      </div>
      <h2 class="font-display text-2xl font-bold text-on-background tracking-tight mb-2">Password Updated</h2>
      <p class="text-sm text-text-muted mb-6">Your credentials have been securely refreshed. You can now log in.</p>
      <a href="index.html" class="w-full bg-primary hover:bg-primary-container text-on-primary font-semibold text-sm py-3 px-4 rounded-xl transition text-center">
        Log In
      </a>
    </div>

  </div>

  <script>
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
