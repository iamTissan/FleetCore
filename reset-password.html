<body class="bg-background-subtle text-on-surface font-body-md min-h-screen flex items-center justify-center antialiased p-md">
<div class="w-full max-w-md bg-surface-container-lowest border border-border-light rounded-2xl p-xl shadow-sm">
<div class="flex items-center gap-sm mb-lg">
<img alt="FleetCore" class="w-9 h-9 rounded-md" src="assets/images/logo.png"/>
<span class="font-display text-headline-sm font-black text-primary">FleetCore</span>
</div>

<h1 class="font-display text-headline-md font-bold text-on-background mb-xs">Set New Password</h1>
<p class="font-body-sm text-body-sm text-text-muted mb-lg">Choose a new password for your FleetCore account.</p>
<form id="reset-form" class="flex flex-col gap-md">
<div>
<label class="font-label-sm text-label-sm text-text-muted">New Password</label>
<input class="w-full mt-xs px-sm py-sm border border-border-light rounded-lg font-body-sm" id="new-password" required type="password"/>
</div>
<div>
<label class="font-label-sm text-label-sm text-text-muted">Confirm Password</label>
<input class="w-full mt-xs px-sm py-sm border border-border-light rounded-lg font-body-sm" id="confirm-password" required type="password"/>
</div>
<button class="mt-sm w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-md rounded-lg transition-all active:scale-[0.98]" type="submit">Update Password</button>
</form>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="./js/config.js"></script>
