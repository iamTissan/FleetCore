<body class="bg-background-subtle text-on-surface font-body-md min-h-screen pb-24 md:pb-0" data-fc-guard="driver">
<div class="flex items-center justify-between px-4 pt-6 pb-4">
<div class="flex items-center gap-2.5">
<img alt="FleetCore" class="w-8 h-8 rounded-md object-cover" src="../assets/images/logo.png"/>
<div>
<h1 class="font-display text-headline-md font-bold text-on-background leading-tight">Report Incident</h1>
<p class="font-body-sm text-body-sm text-text-muted">Select a type and send — help is on the way.</p>
</div>
</div>
<img alt="Driver avatar" class="w-10 h-10 rounded-full object-cover border border-border-light" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%23E2E8F0'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%2394A3B8'/%3E%3Cpath d='M6 36c0-8 6.5-13 14-13s14 5 14 13' fill='%2394A3B8'/%3E%3C/svg%3E"/>
</div>
<main class="px-4 pb-8">

<div class="flex flex-col gap-md">
<div class="grid grid-cols-2 gap-md">
<button class="flex flex-col items-center gap-sm p-lg bg-surface-container-lowest border-2 border-border-light rounded-xl hover:border-danger-red transition-colors" data-incident-type="road" type="button">
<span class="material-symbols-outlined text-4xl text-danger-red">car_crash</span>
<span class="font-label-md text-label-md">Road Incident</span>
</button>
<button class="flex flex-col items-center gap-sm p-lg bg-surface-container-lowest border-2 border-border-light rounded-xl hover:border-danger-red transition-colors" data-incident-type="health" type="button">
<span class="material-symbols-outlined text-4xl text-danger-red">medical_services</span>
<span class="font-label-md text-label-md">Health Emergency</span>
</button>
<button class="flex flex-col items-center gap-sm p-lg bg-surface-container-lowest border-2 border-border-light rounded-xl hover:border-danger-red transition-colors" data-incident-type="mechanical" type="button">
<span class="material-symbols-outlined text-4xl text-danger-red">build</span>
<span class="font-label-md text-label-md">Mechanical</span>
</button>
<button class="flex flex-col items-center gap-sm p-lg bg-surface-container-lowest border-2 border-border-light rounded-xl hover:border-danger-red transition-colors" data-incident-type="security" type="button">
<span class="material-symbols-outlined text-4xl text-danger-red">shield</span>
<span class="font-label-md text-label-md">Security</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-text-muted text-center -mt-xs" id="incident-type-hint">Select an incident type above</p>
<form id="incident-form" class="flex flex-col gap-md mt-md">
<div>
<label class="font-label-sm text-label-sm text-text-muted">Short description</label>
<textarea class="w-full mt-xs px-sm py-sm border border-border-light rounded-lg font-body-sm" id="incident-details" rows="4" placeholder="What happened?"></textarea>
</div>
<div>
<label class="font-label-sm text-label-sm text-text-muted">Attach photo (optional)</label>
<input class="w-full mt-xs" type="file" accept="image/*" id="incident-photo"/>
</div>
<button class="w-full py-md bg-danger-red text-white font-label-md text-label-md rounded-lg flex items-center justify-center gap-sm active:scale-[0.98] transition-all" type="submit">
<span class="material-symbols-outlined">emergency</span> Send SOS Now
</button>
</form>
</div>

</main>
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface border-t border-border-light shadow-lg rounded-t-xl" data-fc-sidebar>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all scale-90 active:duration-200" href="dashboard.html" data-fc-nav><span class="material-symbols-outlined">local_shipping</span><span class="font-label-sm text-label-sm mt-1">Trips</span></a>

<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 hover:bg-surface-container-high transition-all scale-90 active:duration-200" href="incident-report.html" data-fc-nav><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency</span><span class="font-label-sm text-label-sm mt-1">SOS</span></a>

</nav>

</html>
