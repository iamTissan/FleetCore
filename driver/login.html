.fc-driver-card{animation:fcCardIn .6s cubic-bezier(.22,1,.36,1) both;}

<body class="bg-background-subtle font-body-md text-body-md text-on-surface h-screen w-full flex flex-col antialiased relative overflow-hidden">
<div class="fc-driver-blob-1"></div>
<div class="fc-driver-blob-2"></div>
<!-- TopAppBar Semantic Shell (Header only for branding context, Nav omitted per transactional rules) -->
<header class="flex justify-between items-center px-container-margin h-16 w-full border-b border-border-light bg-surface-container-lowest relative z-10">
<div class="flex items-center gap-2">
<img alt="FleetCore" class="w-7 h-7 rounded-md object-cover" src="../assets/images/logo.png"/>
<span class="font-headline-md text-headline-md font-bold tracking-tight"><span class="text-on-surface">Fleet</span><span class="text-secondary">Core</span></span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-margin relative z-10">
<div class="w-full max-w-md bg-surface-container-lowest border border-border-light rounded-xl p-xl shadow-sm fc-driver-card">
<!-- Header Section -->
<div class="mb-lg text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Driver Sign In</h1>
<p class="font-body-md text-body-md text-text-muted">Enter your credentials to access your daily manifest.</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" id="login-form">
<!-- Email Input -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-muted">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-border-light rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all duration-200" id="email" name="email" placeholder="driver@fleetcore.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="../forgot-password.html">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-muted">
<span class="material-symbols-outlined text-[20px]">key</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-border-light rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3 mt-4 bg-primary-container text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 hover:bg-primary transition-colors duration-200 shadow-sm hover:shadow active:scale-[0.98]" id="login-btn" type="submit">
<span>Sign In to Terminal</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Trust / Microcopy Footer -->
<div class="mt-xl flex items-center justify-center gap-2 text-text-muted font-label-sm text-label-sm pt-md border-t border-border-light">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>Secured by FleetCore Encryption</span>
</div>
<!-- Secondary Action (Example for drivers needing support) -->
<div class="mt-md text-center flex flex-col gap-xs">
<a class="font-label-sm text-label-sm text-text-muted hover:text-on-surface transition-colors" href="mailto:support@fleetcore.app">Contact Dispatch Support</a>
<a class="font-label-sm text-label-sm text-text-muted hover:text-on-surface transition-colors" href="../index.html">Not a driver? Standard login →</a>
</div>
</div>
</main>
<!-- Bottom Navigation Shell omitted as this is a transactional screen (Login) -->
