<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FleetCore - Email Confirmed</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border-light": "#E2E8F0",
            "on-primary": "#ffffff",
            "warning-amber": "#D97706",
            "background-subtle": "#F8FAFC",
            "secondary": "#006c4a",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-surface": "#131b2e",
            "on-background": "#131b2e",
            "surface-container-lowest": "#ffffff",
            "text-muted": "#64748B",
            "danger-red": "#DC2626"
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background-subtle text-on-surface font-body min-h-screen flex items-center justify-center antialiased p-4 sm:p-6">
  <div class="w-full max-w-md bg-surface-container-lowest border border-border-light rounded-2xl p-8 sm:p-10 shadow-sm transition-all">
    
    <!-- Brand Header -->
    <div class="flex items-center gap-2.5 mb-8">
      <img alt="FleetCore" class="w-9 h-9 rounded-md object-contain" src="assets/images/logo.png"/>
      <span class="font-display text-xl font-black tracking-tight text-primary">FleetCore</span>
    </div>

    <!-- Confirmation Body -->
    <div class="text-center flex flex-col items-center">
      <div class="w-16 h-16 rounded-full bg-emerald-50 text-secondary flex items-center justify-center mb-5">
        <span class="material-symbols-outlined text-4xl">check_circle</span>
      </div>
      
      <h1 class="font-display text-2xl font-bold text-on-background tracking-tight mb-2">Email Confirmed</h1>
      <p class="text-sm text-text-muted leading-relaxed max-w-xs mb-8">
        Your email address has been verified. Your FleetCore account is now active and ready to use.
      </p>

      <a href="index.html" class="inline-flex items-center justify-center gap-2 w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-semibold text-sm py-3 px-4 rounded-xl shadow-sm transition duration-150">
        <span>Continue to Login</span>
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </a>
    </div>

    <!-- Secondary Help Link -->
    <p class="text-center mt-6 text-xs text-text-muted">
      Need help? <a href="#" class="text-primary hover:underline font-medium">Contact Operations Support</a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
